; Límites apretados a propósito: son los de un hosting compartido
; típico. Si el procesamiento de un PDF o una foto grande no entra acá,
; tampoco va a entrar en WNPower, y es mejor enterarse en local.
memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 20M
post_max_size = 21M

; Los errores van al log, nunca a la respuesta: un stack trace en el
; cuerpo de un webhook filtra rutas y credenciales.
display_errors = Off
log_errors = On
error_reporting = E_ALL

date.timezone = America/Argentina/Buenos_Aires
expose_php = Off
