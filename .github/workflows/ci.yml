name: CI

# Push a main dispara la cadena entera. Si algo falla, no se despliega.
# El objetivo no es la ceremonia: es poder cambiar de modelo de IA un
# martes a la noche sin miedo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sólo se cancelan corridas de PR. En main no, porque cancelar a mitad
# de camino cortaría un FTP en curso y dejaría el sitio a medio publicar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unitarios:
    name: Unitarios (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 es el piso que soporta el hosting; 8.4 es la versión de
        # desarrollo. Probar las dos evita el clásico "en mi máquina anda".
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl
          coverage: none

      - name: Verificar sintaxis
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests unitarios
        run: php tests/run.php --unit

  integracion:
    name: Integración contra MariaDB
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: budget_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: budget_test
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl
          coverage: none

      # Que las migraciones corran limpias desde cero es parte de la
      # suite: en producción no hay rollback de un CREATE TABLE a medias.
      - name: Migraciones desde cero
        run: php bin/migrate.php

      - name: Migraciones idempotentes
        run: |
          php bin/migrate.php
          php bin/migrate.php --status

      - name: Tests de integración
        run: php tests/run.php

  desplegar:
    name: Desplegar a WNPower
    needs: [unitarios, integracion]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: produccion
    # Un solo despliegue a la vez, y nunca cancelado: el firewall de
    # WNPower corta la IP ante ráfagas, y un FTP interrumpido deja
    # archivos a medio subir en producción.
    concurrency:
      group: deploy-wnpower
      cancel-in-progress: false
    env:
      # El contexto `secrets` no está disponible en el `if` de un job,
      # así que se expone acá para poder condicionar los pasos.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Sin credenciales cargadas el despliegue se saltea en vez de
      # fallar: un CI permanentemente en rojo enseña a ignorarlo.
      - name: Avisar que falta configurar el despliegue
        if: env.FTP_SERVER == ''
        run: |
          echo "::notice::Despliegue salteado: falta cargar los secretos FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR y WEBHOOK_URL."

      # Git Bash convierte rutas absolutas al pasarlas como argumento, y
      # "/budget/" llegó a este secreto como "C:/Program Files/Git/budget/".
      # El despliegue no falló: creó ese árbol en el servidor y publicó ahí
      # durante dos corridas, mientras la aplicación real quedaba vieja.
      - name: Validar la ruta de destino
        if: env.FTP_SERVER != ''
        env:
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          case "$FTP_DIR" in
            /*) ;;
            *) echo "::error::FTP_DIR tiene que empezar con /. Llegó: $FTP_DIR"; exit 1 ;;
          esac
          case "$FTP_DIR" in
            *:*|*\*) echo "::error::FTP_DIR parece una ruta de Windows: $FTP_DIR"; exit 1 ;;
          esac
          echo "Destino válido: $FTP_DIR"

      - name: Subir por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          # El .env de producción vive en el servidor y nunca se pisa
          # desde el repo: es el único archivo con secretos reales.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/docker/**
            **/docs/**
            docker-compose.yml
            .env
            .env.example
            storage/**

      # Verificación post-despliegue sin secretos: el webhook tiene que
      # contestar 403 ante una petición sin el token. Un 500 o un 404
      # significan que el deploy rompió el bot aunque los tests pasen.
      - name: Verificar que el webhook sigue vivo
        if: env.FTP_SERVER != '' && env.WEBHOOK_URL != ''
        run: |
          # Un solo pedido, sin reintentos: el firewall de WNPower bloquea
          # la IP ante ráfagas y sólo lo destraba una persona con captcha.
          codigo=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -X POST "${{ secrets.WEBHOOK_URL }}" -d '{}')
          echo "El webhook respondió $codigo"
          if [ "$codigo" = "403" ]; then
            echo "Webhook vivo y rechazando pedidos sin secreto."
            exit 0
          fi
          echo "::error::Se esperaba 403. Un 503 con página de bloqueo significa que el firewall cortó la IP: lo destraba una persona desde el navegador."
          exit 1
